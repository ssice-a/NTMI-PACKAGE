namespace = NTMIv1

; Generic NTMI skinning core.
;
; Caller-owned bindings:
;   cs-t64 = collector-built global T0 atlas
;   cs-t65 = local palette, one global bone index per local bone
;   cs-t66 = packed blend buffer exposed as R32_UINT
;   cs-t67 = source frame buffer
;   cs-t68 = source position buffer
;   cs-u6  = skinned normal/frame output UAV
;   cs-u7  = skinned position output UAV
;
; Caller-owned constants:
;   $\NTMIv1\vertex_count   = mesh vertex count

[ResourceRuntimeGlobalT0]
; Shared scratch atlas for collector-built global T0 rows.
; Mod ini files should build into and bind this resource, then immediately
; skin into their own dynamic outputs before another collector group reuses it.
type = StructuredBuffer
stride = 16
array = 65536

[Constants]
global $vertex_count = 0

[CustomShaderSkinFromBoundSlots]
cs = Shaders/SkinFromAtlasBoundSlots.hlsl
dispatch = $vertex_count/64+1, 1, 1

[CommandListSkinFromBoundSlots]
run = CustomShaderSkinFromBoundSlots
